<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" fill="#f8f8f6"/>
  <text x="70" y="80" font-family="Inter,Arial" font-size="42" font-weight="700" fill="#202b28">EmailPilot architecture</text>
  <g font-family="Inter,Arial" text-anchor="middle">
    <rect x="40" y="220" rx="16" width="140" height="120" fill="#202b28"/><text x="110" y="270" fill="#14b8a6" font-size="18">User</text><text x="110" y="305" fill="#fff" font-size="16">Email or command</text>
    <line x1="180" y1="280" x2="230" y2="280" stroke="#b9c2bf" stroke-width="3"/>
    <rect x="230" y="220" rx="16" width="160" height="120" fill="#fff" stroke="#d8dedb"/><text x="310" y="270" fill="#5b5bf0" font-size="18">Perceive</text><text x="310" y="305" fill="#202b28" font-size="16">Read fields</text>
    <line x1="390" y1="280" x2="440" y2="280" stroke="#b9c2bf" stroke-width="3"/>
    <rect x="440" y="190" rx="16" width="220" height="180" fill="#fff" stroke="#d8dedb"/><text x="550" y="250" fill="#5b5bf0" font-size="18">Decide</text><text x="550" y="290" fill="#202b28" font-size="16">RuleBrain</text><text x="550" y="320" fill="#202b28" font-size="16">optional LLMBrain</text>
    <line x1="660" y1="280" x2="710" y2="280" stroke="#b9c2bf" stroke-width="3"/>
    <rect x="710" y="220" rx="16" width="180" height="120" fill="#fff" stroke="#d8dedb"/><text x="800" y="270" fill="#14b8a6" font-size="18">Tools</text><text x="800" y="305" fill="#202b28" font-size="14">Summarise, label, reply</text>
    <line x1="890" y1="280" x2="940" y2="280" stroke="#b9c2bf" stroke-width="3"/>
    <rect x="940" y="220" rx="16" width="160" height="120" fill="#fff" stroke="#d8dedb"/><text x="1020" y="270" fill="#5b5bf0" font-size="18">Memory</text><text x="1020" y="305" fill="#202b28" font-size="16">Tasks in memory</text>
    <line x1="1100" y1="280" x2="1150" y2="280" stroke="#b9c2bf" stroke-width="3"/>
    <rect x="1150" y="220" rx="16" width="210" height="120" fill="#202b28"/><text x="1255" y="270" fill="#14b8a6" font-size="18">Respond</text><text x="1255" y="305" fill="#fff" font-size="16">UI + trace</text>
  </g>
</svg>
